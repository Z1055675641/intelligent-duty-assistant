# ============================================================
# Streamlit Secrets 模板
# - 云端部署：把下面的键值填进 Streamlit Cloud 的 Secrets 面板
# - 本机本地测试：复制本文件为 .streamlit/secrets.toml（会被 .gitignore 忽略）
# ============================================================

# 必填：DeepSeek API Key
DEEPSEEK_API_KEY = "sk-你的真实密钥"

# 云端需联网下载模型时设为 "0"（本机默认离线 "1"）
HF_OFFLINE = "0"

# 可选：模型下载源（默认官方源 huggingface.co；国内本地联网下载可改为 hf-mirror 镜像）
# HF_ENDPOINT = "https://hf-mirror.com"

# 可选：FAISS 索引路径（云端 data/faiss_index 的 ASCII 绝对路径）
# FAISS_INDEX_PATH = "/app/data/faiss_index"

# 可选：模型缓存目录
# HF_CACHE_DIR = "/app/.cache/huggingface/hub"

# 可选：换 LLM 供应商（OpenAI 兼容接口）时覆盖，改完 Reboot 生效（详见使用手册 4.5 节）
# LLM_BASE_URL = "https://api.deepseek.com/v1"
# LLM_MODEL = "deepseek-chat"
